<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b18">
    <title>TERMO // CYBERPUNK</title>
    <style>
        :root {
            color-scheme: dark;
            --cyan: #62f6ff;
            --blue: #638cff;
            --purple: #c16bff;
            --green: #42ff9e;
            --yellow: #ffe66d;
            --red: #ff4568;
            --ink: #eafaff;
            --square: clamp(48px, 12vw, 66px);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 38px 16px;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            color: var(--ink);
            font-family: "Arial", sans-serif;
            background:
                radial-gradient(ellipse at 50% 42%, rgba(23, 71, 116, .36), transparent 48%),
                radial-gradient(ellipse at 12% 90%, rgba(115, 34, 157, .2), transparent 35%),
                linear-gradient(145deg, #050711, #0b1022 55%, #080914);
        }

        body::before {
            position: fixed;
            inset: 0;
            z-index: 0;
            content: "";
            pointer-events: none;
            opacity: .2;
            background-image:
                linear-gradient(rgba(98, 246, 255, .13) 1px, transparent 1px),
                linear-gradient(90deg, rgba(98, 246, 255, .13) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(transparent, black 18%, black 85%, transparent);
        }

        /* Cidade neon em camadas, mantida atrás do painel do jogo. */
        .cityscape {
            position: fixed;
            z-index: 0;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            background: linear-gradient(180deg, transparent 45%, rgba(5, 6, 20, .25) 70%, rgba(5, 6, 18, .8));
        }

        .city-glow {
            position: absolute;
            left: 50%;
            bottom: 5%;
            width: min(100vw, 1200px);
            height: 45vh;
            transform: translateX(-50%);
            background: radial-gradient(ellipse, rgba(196, 35, 177, .23), transparent 68%);
            filter: blur(20px);
        }

        .building {
            position: absolute;
            bottom: 0;
            overflow: hidden;
            border: 1px solid rgba(89, 143, 201, .24);
            background-color: #080d20;
            background-image:
                repeating-linear-gradient(90deg, transparent 0 15px, rgba(65, 217, 255, .35) 16px 18px, transparent 19px 30px),
                repeating-linear-gradient(0deg, transparent 0 18px, rgba(255, 53, 166, .21) 19px 21px, transparent 22px 34px),
                linear-gradient(115deg, rgba(21, 33, 65, .96), rgba(7, 10, 25, .98));
            background-size: 100% 100%, 100% 100%, 100% 100%;
            box-shadow: inset 0 0 25px rgba(49, 104, 189, .22), 0 0 24px rgba(41, 101, 190, .12);
            opacity: .82;
            clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%, 0 11%);
        }

        .building::before {
            position: absolute;
            inset: 0;
            content: "";
            opacity: .58;
            background: repeating-linear-gradient(90deg, transparent 0 28px, rgba(3, 5, 15, .55) 29px 34px);
        }

        .building-left { left: -2%; width: 23%; height: 66vh; }
        .building-left-mid { left: 17%; width: 18%; height: 47vh; opacity: .58; }
        .building-right-mid { right: 18%; width: 18%; height: 53vh; opacity: .6; }
        .building-right { right: -3%; width: 25%; height: 72vh; }
        .building-far { left: 39%; width: 22%; height: 34vh; opacity: .42; }

        .billboard {
            position: absolute;
            z-index: 1;
            display: grid;
            place-items: center;
            overflow: hidden;
            border: 2px solid rgba(113, 250, 255, .9);
            background: linear-gradient(135deg, rgba(10, 34, 65, .96), rgba(56, 12, 72, .96));
            color: #eaffff;
            font-size: clamp(9px, 1.25vw, 15px);
            font-weight: 900;
            letter-spacing: .18em;
            text-align: center;
            text-shadow: 0 0 6px var(--cyan), 0 0 15px var(--purple);
            box-shadow: 0 0 12px rgba(98, 246, 255, .85), inset 0 0 16px rgba(193, 107, 255, .42);
            animation: billboard-cycle 5s linear infinite;
        }

        .billboard::before {
            position: absolute;
            inset: 0;
            content: "";
            opacity: .25;
            background: repeating-linear-gradient(to bottom, transparent 0 4px, rgba(255, 255, 255, .45) 5px, transparent 6px);
        }

        .billboard-one { top: 24%; left: 8%; width: 78%; height: 17%; }
        .billboard-two { top: 46%; right: 9%; width: 76%; height: 14%; animation-delay: -1.7s; border-color: rgba(255, 78, 195, .9); }
        .billboard-three { top: 13%; left: 11%; width: 76%; height: 15%; animation-delay: -3.1s; border-color: rgba(255, 230, 109, .9); }
        .billboard-four { top: 54%; left: 12%; width: 76%; height: 13%; animation-delay: -.8s; }

        .billboard-label { position: relative; z-index: 1; }

        /* Ciclo de 5 s: um flash e pausa de 3 s, depois dois flashes durante 2 s. */
        @keyframes billboard-cycle {
            0%, 3%, 7%, 100% { opacity: 1; filter: brightness(1); }
            4.5% { opacity: .12; filter: brightness(.35); }
            6% { opacity: 1; filter: brightness(1.7); }
            59%, 62%, 66% { opacity: 1; filter: brightness(1); }
            60.5% { opacity: .12; filter: brightness(.35); }
            64% { opacity: 1; filter: brightness(1.8); }
            67.5% { opacity: .12; filter: brightness(.35); }
            69% { opacity: 1; filter: brightness(1.6); }
        }

        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: .13;
            background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(255,255,255,.25) 4px, transparent 5px);
        }

        .flight-lane {
            position: fixed;
            z-index: 1;
            top: 44%;
            left: 0;
            width: 100%;
            height: 100px;
            overflow: hidden;
            pointer-events: none;
            perspective: 500px;
        }

        .craft {
            position: absolute;
            left: -150px;
            top: 28px;
            width: 74px;
            height: 23px;
            border: 1px solid rgba(98, 246, 255, .9);
            border-radius: 55% 25% 45% 35%;
            background: linear-gradient(110deg, rgba(21, 43, 69, .95), rgba(96, 43, 140, .9));
            box-shadow: 0 0 12px var(--cyan), 0 0 28px rgba(98, 246, 255, .42);
            animation: fly-by 18s linear infinite;
        }

        .craft::before {
            position: absolute;
            content: "";
            width: 25px;
            height: 10px;
            left: 23px;
            top: -8px;
            border: 1px solid var(--cyan);
            border-radius: 50% 50% 15% 15%;
            background: rgba(98, 246, 255, .35);
            box-shadow: 0 0 9px var(--cyan);
        }

        .craft::after {
            position: absolute;
            content: "";
            width: 20px;
            height: 3px;
            left: -17px;
            top: 10px;
            background: var(--purple);
            box-shadow: 0 0 12px var(--purple), -12px 0 18px rgba(193, 107, 255, .45);
        }

        .craft:nth-child(2) { top: 58px; transform: scale(.7); animation-duration: 24s; animation-delay: -8s; opacity: .72; }
        .craft:nth-child(3) { top: 5px; transform: scale(.52); animation-duration: 28s; animation-delay: -17s; opacity: .58; }

        .app {
            position: relative;
            z-index: 2;
            width: min(100%, 650px);
            padding: clamp(22px, 5vw, 38px);
            border: 1px solid rgba(98, 246, 255, .48);
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(8, 15, 31, .88), rgba(10, 13, 30, .82));
            box-shadow: 0 0 25px rgba(98, 246, 255, .2), inset 0 0 35px rgba(98, 246, 255, .055);
            backdrop-filter: blur(7px);
        }

        .app::before, .app::after {
            position: absolute;
            width: 25px;
            height: 25px;
            content: "";
            border-color: var(--purple);
            border-style: solid;
            filter: drop-shadow(0 0 5px var(--purple));
        }
        .app::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .app::after { right: -1px; bottom: -1px; border-width: 0 2px 2px 0; }

        h1 {
            margin: 0 0 8px;
            color: var(--cyan);
            text-align: center;
            font-size: clamp(1.55rem, 6vw, 2.4rem);
            letter-spacing: .22em;
            text-shadow: 0 0 8px var(--cyan), 0 0 22px rgba(98, 246, 255, .65);
            animation: title-flicker 5s infinite;
        }

        .subtitle {
            margin: 0 0 26px;
            color: #9cb4d3;
            text-align: center;
            font-size: .75rem;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        #jogo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        #jogo form {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 9px;
            width: 100%;
            padding: 8px 0;
        }

        .letter-box {
            flex: 0 0 var(--square);
            width: var(--square);
            height: var(--square);
            padding: 0;
            border: 2px solid rgba(98, 246, 255, .65);
            border-radius: 8px;
            outline: none;
            background: rgba(7, 14, 29, .92);
            color: white;
            text-align: center;
            text-transform: uppercase;
            font-size: clamp(1.45rem, 6vw, 2rem);
            font-weight: 800;
            caret-color: var(--cyan);
            box-shadow: inset 0 0 13px rgba(98, 246, 255, .1), 0 0 7px rgba(98, 246, 255, .16);
            transition: border-color .2s, box-shadow .2s, background-color .2s;
        }

        .letter-box:focus {
            border-color: white;
            box-shadow: 0 0 15px rgba(98, 246, 255, .8), inset 0 0 13px rgba(98, 246, 255, .16);
        }

        .letter-box.is-absent {
            border-color: var(--red);
            background: rgba(255, 40, 76, .68);
            box-shadow: 0 0 13px rgba(255, 69, 104, .8), inset 0 0 13px rgba(255, 69, 104, .35);
            animation: glitch .18s steps(2, end) infinite, red-pulse .8s ease-in-out infinite;
        }

        .letter-box.is-present {
            border-color: var(--yellow);
            background: rgba(255, 214, 64, .48);
            box-shadow: 0 0 14px rgba(255, 230, 109, .72), inset 0 0 12px rgba(255, 230, 109, .28);
            animation: yellow-pulse .85s ease-in-out infinite;
        }

        .letter-box.is-correct {
            border-color: var(--green);
            background: rgba(27, 194, 108, .56);
            box-shadow: 0 0 17px rgba(66, 255, 158, .85), inset 0 0 14px rgba(66, 255, 158, .35);
            animation: correct-pop .55s cubic-bezier(.2, 1.6, .4, 1) both;
        }

        #jogo input[type="submit"] {
            flex: 0 0 auto;
            margin: 7px 0 0;
            padding: 11px 22px;
            border: 1px solid var(--cyan);
            border-radius: 6px;
            background: rgba(18, 50, 72, .76);
            color: var(--cyan);
            font-weight: 800;
            letter-spacing: .16em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(98, 246, 255, .28);
            transition: background .2s, color .2s, box-shadow .2s, transform .2s;
        }

        #jogo input[type="submit"]:hover {
            transform: translateY(-2px);
            background: var(--cyan);
            color: #07101d;
            box-shadow: 0 0 20px rgba(98, 246, 255, .72);
        }

        .used-panel { margin-top: 30px; text-align: center; }
        .used-panel h2 {
            margin: 0 0 10px;
            color: var(--purple);
            font-size: .92rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            text-shadow: 0 0 9px rgba(193, 107, 255, .6);
        }
        #letrasutilizadas {
            min-height: 1.5em;
            color: #c7d7ef;
            font-weight: 700;
            letter-spacing: .25em;
            overflow-wrap: anywhere;
        }

        @keyframes fly-by {
            0% { left: -150px; transform: translateY(0) rotate(-3deg) scale(.8); }
            25% { transform: translateY(-17px) rotate(2deg) scale(.92); }
            55% { transform: translateY(12px) rotate(-1deg) scale(1); }
            100% { left: calc(100% + 150px); transform: translateY(-8px) rotate(2deg) scale(.75); }
        }
        @keyframes glitch {
            0% { transform: translate(0); filter: hue-rotate(0deg); }
            25% { transform: translate(-2px, 1px) skewX(4deg); filter: hue-rotate(20deg); }
            50% { transform: translate(2px, -1px); filter: brightness(1.5); }
            75% { transform: translate(-1px, 0) skewX(-4deg); filter: hue-rotate(-20deg); }
            100% { transform: translate(0); }
        }
        @keyframes red-pulse { 50% { opacity: .65; box-shadow: 0 0 22px var(--red); } }
        @keyframes yellow-pulse { 50% { opacity: .62; box-shadow: 0 0 23px var(--yellow); } }
        @keyframes correct-pop {
            0% { transform: scale(.75) rotate(-5deg); }
            65% { transform: scale(1.14) rotate(2deg); }
            100% { transform: scale(1) rotate(0); }
        }
        @keyframes title-flicker {
            0%, 96%, 100% { opacity: 1; }
            97% { opacity: .68; }
            98% { opacity: .92; }
            99% { opacity: .72; }
        }

        @media (max-width: 600px) {
            .building-left { left: -12%; width: 34%; }
            .building-left-mid { left: 14%; width: 25%; }
            .building-right-mid { right: 13%; width: 25%; }
            .building-right { right: -14%; width: 36%; }
            .building-far { display: none; }
            .billboard { font-size: 8px; letter-spacing: .08em; }
        }

        @media (max-width: 420px) {
            body { padding: 22px 10px; }
            .app { padding: 24px 12px; }
            #jogo form { gap: 6px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <div class="cityscape" aria-hidden="true">
        <div class="city-glow"></div>
        <div class="building building-left">
            <div class="billboard billboard-one"><span class="billboard-label">NIGHT CITY</span></div>
        </div>
        <div class="building building-left-mid">
            <div class="billboard billboard-four"><span class="billboard-label">NEON // 2077</span></div>
        </div>
        <div class="building building-far"></div>
        <div class="building building-right-mid">
            <div class="billboard billboard-three"><span class="billboard-label">NOVA CORP</span></div>
        </div>
        <div class="building building-right">
            <div class="billboard billboard-two"><span class="billboard-label">CITY LIGHTS</span></div>
        </div>
    </div>

    <div class="flight-lane" aria-hidden="true">
        <span class="craft"></span>
        <span class="craft"></span>
        <span class="craft"></span>
    </div>
    <div class="scanlines" aria-hidden="true"></div>

    <main class="app">
        <h1>TERMO</h1>
        <p class="subtitle">Neural word interface // v.01</p>
        <div id="jogo"></div>
        <section class="used-panel" aria-live="polite">
            <h2>Letras utilizadas</h2>
            <div id="letrasutilizadas"></div>
        </section>
    </main>

    <script src="termo.js"></script>
</body>
</html>
